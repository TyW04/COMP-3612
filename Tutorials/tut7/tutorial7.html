<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tutorial 7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tutorial7.css">
    <script src="tutorial7.js" type="module"></script> 
</head>    
<body>
    <div class="panel">
        <h2>Exercise 2</h2>
        <p class="help">Button click event</p>
        <div class="demo" id="demo2">
            <button id="btn2">Click to increment count</button>
            <p>Current count value is <span id="span2"></span></p>
        </div>        
    </div>

    <div class="panel" >
        <h2>Exercise 3</h2>
        <p class="help">Change CSS display property based on event</p>
        <div class="demo" id="demo3">
            <label>Hide image ? </label><input type="checkbox"  />
            <img src="sample.jpg"  />
        </div>
    </div>

    <div class="panel">
        <h2>Exercise 4</h2>
        <p class="help">Populate a select list and handle its change event</p>
        <div class="demo" id="demo4">
            <select>
                <option value="0">Select a product</option>
            </select>
            <p>Current selected product is <span id="span4"></span></p>
        </div>                
    </div>
   
    <div class="panel">
        <h2>Exercise 5</h2>
        <p class="help">Populate a table with the product data</p>
        <div class="demo" id="demo5">
            <table>
                <tr>
                    <th>Id</th>
                    <th>Title</th>
                    <th>Price</th>
                </tr>
            </table>
        </div>                
    </div>           


       
</body>
</html>
