<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Tutorial 2</title>
        <style>
            h2 {
                margin: 0;
            }

            body {
                font-size: 14px;
            }

            main {
                background-color: tan;
                margin: 5px;
                margin-top: 50px;
                padding: 10px;
                padding-left: 50px;
            }

            .box {
                border: 1px solid black;
                margin: 10px;
                width: 100px;
            }

            .large {
                font-size: 1.2rem;
            }

            #first {
                background-image: url("emirates.jpg");
                background-repeat: no-repeat;
            }
            
            #first div {
                background-color: rgba(255,120,100,0.5);
                display: inline-block;
            }

            a:link,
            a:visited {
                text-decoration: none;
                color: green;
            }

            .box a:hover {
                color: purple;
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <main>
            <article id="first">
                <div class="box">
                    <h2 title="name">title</h2>
                    <p>para 1</p>
                    <p>para 2</p>
                </div>
                <div class="box">
                    <p>para 1</p>
                    <div>
                        <p>para 2</p>
                    </div>
                </div>
            </article>
            <article id="second" >
                <div class="box">
                    <p>para 1</p>
                    <p>para 2</p>
                    <a href=# >first link</a>
                </div>
                <a href=# title="link" ><span class="large box">Hello</span></a>
            </article>
            <div id="container" class="large box"></div>
        </main>
        
    </body>
</html>
